# .github/workflows/atualizar-painel.yml
#
# Estrutura no repositório:
#   coleta.py
#   requirements.txt        -> requests e pypdf
#   site/index.html
#   site/dados.json         -> gerado aqui
#   .github/workflows/atualizar-painel.yml
#
# Settings > Pages > Source = "GitHub Actions"
# Settings > Actions > General > Workflow permissions = "Read and write"

name: Atualizar painel TCU

on:
  schedule:
    # Uma vez por dia, em dias úteis. 09:00 UTC = 06:00 em Brasília — a coleta
    # fica pronta antes do expediente. O horário de madrugada também deixa a base
    # do TCU já atualizada com o movimento do dia anterior, que é o que a caixa
    # de novidades compara.
    - cron: "0 9 * * 1-5"
  workflow_dispatch:
    inputs:
      todos_acordaos:
        description: "Baixar os acórdãos de TODOS os processos (não só os com movimento recente)"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/index.html", "site/kanban.html", "coleta.py", "gerar_kanban.py", "baixar_acordaos.py", "extrair_deliberacoes.py", "site/deliberacoes.html", "acordaos_extra.txt", "prazos.txt", "requirements.txt"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: painel-tcu
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  coletar:
    runs-on: ubuntu-latest
    # 30 min é folgado para uma coleta saudável (poucos minutos). O teto existe
    # para CORTAR cedo se algo travar — não para acomodar uma coleta lenta. Se
    # bater neste limite, é sinal de problema a investigar, não de aumentar o teto.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # o quadro de etapas lê o histórico do dados.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Dependências
        run: |
          pip install -r requirements.txt
          python -c "import requests; print('ok')"

      - name: Coletar
        run: |
          set +e
          python coleta.py --saida site/dados.json --verbose 2>&1 | tee /tmp/c.log
          codigo=${PIPESTATUS[0]}
          set -e
          if [ "$codigo" -ne 0 ]; then
            echo "::warning::Coleta terminou com código $codigo; o site segue com os dados anteriores."
            tail -n 30 /tmp/c.log
          fi
          exit 0

      - name: Quadro de etapas e prazos
        run: |
          python gerar_kanban.py || echo "::warning::gerar_kanban.py falhou; a página de etapas segue com os dados anteriores."

      - name: Inteiro teor dos acórdãos (público)
        timeout-minutes: 15
        continue-on-error: true
        # Às segundas, ou quando pedido no disparo manual, varre todos os processos;
        # nos outros dias, só os novos ou com movimento nos últimos 10 dias.
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ inputs.todos_acordaos }}" = "true" ]; then
            python baixar_acordaos.py --todos || echo "::warning::baixar_acordaos.py falhou"
          else
            python baixar_acordaos.py || echo "::warning::baixar_acordaos.py falhou"
          fi

      - name: Deliberações dos acórdãos
        run: |
          python extrair_deliberacoes.py || echo "::warning::extrair_deliberacoes.py falhou; a aba Deliberações segue com os dados anteriores."

      - name: Commitar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/dados.json site/kanban.json site/deliberacoes.json acordaos/
          if git diff --cached --quiet; then echo "sem mudanças"; exit 0; fi
          git commit -m "dados: $(date -u +'%Y-%m-%d %H:%M UTC')"
          # Se alguém enviou mudanças enquanto o robô rodava, junta antes de enviar
          # (os arquivos gerados pelo robô não são editados à mão, então não há conflito).
          git pull --rebase -X theirs origin main || git rebase --abort
          git push || { echo "::error::push recusado — marque 'Read and write permissions' em Settings > Actions > General."; exit 1; }

      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  publicar:
    needs: coletar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
